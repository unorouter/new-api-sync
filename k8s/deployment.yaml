# 15-minute repricing cron: `sync metadata` re-prices option maps (GroupRatio
# etc.) from live marketplace prices and re-accepts paused pins, with ZERO
# probes or channel writes. Membership churn runs in new-api-sync-full below.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: new-api-sync
  namespace: services
spec:
  # Skips hours 22 and 23: the nightly full a7 run starts 22:00 Europe/Berlin
  # and may take up to 60 min under a7 throttling; both jobs accept a7 price
  # notices and share its rate budget.
  schedule: "*/15 0-21 * * *"
  timeZone: "Europe/Berlin"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1200
      # No retry: the next tick is 15 minutes away and a retry would hit a7 again.
      backoffLimit: 0
      template:
        metadata:
          labels: { app: new-api-sync }
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: sync
              image: ghcr.io/unorouter/new-api-sync:20a2cca7748c4fb9c62a5be229a1a4906f8bcfb2
              args: ["metadata"]
              # The guest token's model_limits is refreshed from the gateway's
              # OWN free channels, so it needs no provider config -- only the
              # key. Mounted as a file the config is, but Bun.env is not, so
              # without this the guest refresh silently no-ops every run.
              env:
                - name: GUEST_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sync-env
                      key: GUEST_API_KEY
                      optional: true
              resources:
                requests: { memory: 256Mi, cpu: 100m }
                limits: { memory: 1Gi }
              volumeMounts:
                - name: config
                  mountPath: /app/config.yml
                  subPath: config.yml
          volumes:
            - name: config
              secret: { secretName: sync-env }
---
# Verdict cache for the daily full sync: probe verdicts + authenticity
# blacklist are permanent (no TTL), so without persistence every run would
# re-probe all lanes and forget caught fakers. local-path pins pods to one node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: new-api-sync-logs
  namespace: services
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
# Daily FULL a7 sync: membership churn (probe + admit new merchants, delete
# dead lanes, re-pin). The 15-minute metadata cron above handles repricing and
# pin re-accepts; this is the only job that runs live probes.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: new-api-sync-full
  namespace: services
spec:
  schedule: "0 22 * * *"
  timeZone: "Europe/Berlin"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A normal night is 20 to 35 minutes; a throttled marketplace (paced
      # key reveal and pin calls) stretches it past 45. One hour still does
      # not cover a hung run.
      activeDeadlineSeconds: 3600
      # NEVER retry: a second full a7 run minutes after a failed one exhausts
      # a7's rate budget (429 on key reveal and pin), the throttle guard then
      # withholds deletes and the retry fails too (2026-09-06, twice).
      backoffLimit: 0
      template:
        metadata:
          labels: { app: new-api-sync-full }
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: sync
              image: ghcr.io/unorouter/new-api-sync:20a2cca7748c4fb9c62a5be229a1a4906f8bcfb2
              args: ["run", "--only", "a7"]
              env:
                - name: GUEST_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sync-env
                      key: GUEST_API_KEY
                      optional: true
              resources:
                requests: { memory: 256Mi, cpu: 100m }
                limits: { memory: 1Gi }
              volumeMounts:
                - name: config
                  mountPath: /app/config.yml
                  subPath: config.yml
                - name: logs
                  mountPath: /app/logs
          volumes:
            - name: config
              secret: { secretName: sync-env }
            - name: logs
              persistentVolumeClaim: { claimName: new-api-sync-logs }
