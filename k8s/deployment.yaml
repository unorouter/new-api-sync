# 15-minute repricing cron: `sync metadata` re-prices option maps (GroupRatio
# etc.) from live marketplace prices and re-accepts paused pins, with ZERO
# probes or channel writes. Membership churn runs in new-api-sync-full below.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: new-api-sync
  namespace: services
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1200
      backoffLimit: 1
      template:
        metadata:
          labels: { app: new-api-sync }
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: sync
              image: ghcr.io/unorouter/new-api-sync:3dec92a6bcf6f8bcaab6932f60d503f3822de159
              args: ["metadata"]
              # The guest token's model_limits is refreshed from the gateway's
              # OWN free channels, so it needs no provider config -- only the
              # key. Mounted as a file the config is, but Bun.env is not, so
              # without this the guest refresh silently no-ops every run.
              env:
                - name: GUEST_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sync-env
                      key: GUEST_API_KEY
                      optional: true
              resources:
                requests: { memory: 256Mi, cpu: 100m }
                limits: { memory: 1Gi }
              volumeMounts:
                - name: config
                  mountPath: /app/config.yml
                  subPath: config.yml
          volumes:
            - name: config
              secret: { secretName: sync-env }
---
# Verdict cache for the daily full sync: probe verdicts + authenticity
# blacklist are permanent (no TTL), so without persistence every run would
# re-probe all lanes and forget caught fakers. local-path pins pods to one node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: new-api-sync-logs
  namespace: services
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
# Daily FULL a7 sync: membership churn (probe + admit new merchants, delete
# dead lanes, re-pin). The 15-minute metadata cron above handles repricing and
# pin re-accepts; this is the only job that runs live probes.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: new-api-sync-full
  namespace: services
spec:
  schedule: "0 22 * * *"
  timeZone: "Europe/Berlin"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        metadata:
          labels: { app: new-api-sync-full }
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: sync
              image: ghcr.io/unorouter/new-api-sync:3dec92a6bcf6f8bcaab6932f60d503f3822de159
              args: ["run", "--only", "a7"]
              env:
                - name: GUEST_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sync-env
                      key: GUEST_API_KEY
                      optional: true
              resources:
                requests: { memory: 256Mi, cpu: 100m }
                limits: { memory: 1Gi }
              volumeMounts:
                - name: config
                  mountPath: /app/config.yml
                  subPath: config.yml
                - name: logs
                  mountPath: /app/logs
          volumes:
            - name: config
              secret: { secretName: sync-env }
            - name: logs
              persistentVolumeClaim: { claimName: new-api-sync-logs }
