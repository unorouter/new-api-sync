          containers:
            - name: sync
              image: ghcr.io/unorouter/new-api-sync:21b9dc6702b7528d4c36fdbc931ea7aa0e0870d4@sha256:7b1a59d97dbb9eca64ab5f0abb7b728f082fc9db661ac98f736a6577914aeaad
              args: ["metadata"]
              env:
                - name: GUEST_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sync-env
                      key: GUEST_API_KEY
                - name: SYNC_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sync-env
                      key: SYNC_S3_ACCESS_KEY
                - name: SYNC_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sync-env
                      key: SYNC_S3_SECRET_KEY
                      optional: true
              resources:
                requests: { memory: 256Mi, cpu: 100m }
                limits: { memory: 3Gi }
              volumeMounts:
                - name: config
                  mountPath: /app/config.yml
                  subPath: config.yml
                - name: logs
                  mountPath: /app/logs
          volumes:
            - name: config
              secret: { secretName: sync-env-weekly }
            # Not the shared PVC: the full run may hold it, and verdicts merge through the store.
            - name: logs
              emptyDir: {}
