# 15-minute repricing cron: `sync metadata` re-prices option maps (GroupRatio
# etc.) from live marketplace prices and re-accepts paused pins, with ZERO
# probes or channel writes. Membership churn runs in new-api-sync-full below.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: new-api-sync
  namespace: services
spec:
  # Skips the three hours after each full a7 run (04, 10, 16, 22 Europe/Berlin):
  # a walk can take that long under a7's key reveal throttling, and both jobs
  # accept a7 price notices and share its rate budget.
  schedule: "*/15 1-3,7-9,13-15,19-21 * * *"
  timeZone: "Europe/Berlin"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1200
      # No retry: the next tick is 15 minutes away and a retry would hit a7 again.
      backoffLimit: 0
      template:
        metadata:
          labels: { app: new-api-sync }
        spec:
          restartPolicy: Never
          priorityClassName: batch
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: sync
              image: ghcr.io/unorouter/new-api-sync:21b9dc6702b7528d4c36fdbc931ea7aa0e0870d4@sha256:7b1a59d97dbb9eca64ab5f0abb7b728f082fc9db661ac98f736a6577914aeaad
              args: ["metadata"]
              # The guest token's model_limits is refreshed from the gateway's
              # OWN free channels, so it needs no provider config -- only the
              # key. Mounted as a file the config is, but Bun.env is not, so
              # without this the guest refresh silently no-ops every run.
              env:
                - name: GUEST_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sync-env
                      key: GUEST_API_KEY
                - name: SYNC_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sync-env
                      key: SYNC_S3_ACCESS_KEY
                - name: SYNC_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sync-env
                      key: SYNC_S3_SECRET_KEY
                      optional: true
              resources:
                requests: { memory: 256Mi, cpu: 100m }
                limits: { memory: 1Gi }
              volumeMounts:
                - name: config
                  mountPath: /app/config.yml
                  subPath: config.yml
          volumes:
            - name: config
              secret: { secretName: sync-env }
---
# Verdict cache for the daily full sync: probe verdicts + authenticity
# blacklist are permanent (no TTL), so without persistence every run would
# re-probe all lanes and forget caught fakers. local-path pins pods to one node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: new-api-sync-logs
  namespace: services
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
# Daily FULL a7 sync: membership churn (probe + admit new merchants, delete
# dead lanes, re-pin). The 15-minute metadata cron above handles repricing and
# pin re-accepts; this is the only job that runs live probes.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: new-api-sync-full
  namespace: services
spec:
  # Four walks a day: a7 merchants swap backends behind a listing within hours
  # (383 went opus to haiku 20 h after a clean probe), and the authenticity pass
  # for a7 expires after 4 h (authenticityPassTtlHours), so each walk re-probes.
  schedule: "0 4,10,16,22 * * *"
  timeZone: "Europe/Berlin"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A walk is dominated by a7's key reveal, not by probing: on 2026-09-14 the
      # 108 minute run spent 94 minutes keying (five rounds of ~18 min each stuck
      # behind 429 backoff) against 8 minutes of probes. Three hours leaves room
      # for that plus the deeper lane sets; the metadata cron skips those hours.
      activeDeadlineSeconds: 10800
      # NEVER retry: a second full a7 run minutes after a failed one exhausts
      # a7's rate budget (429 on key reveal and pin), the throttle guard then
      # withholds deletes and the retry fails too (2026-09-06, twice).
      backoffLimit: 0
      template:
        metadata:
          labels: { app: new-api-sync-full }
        spec:
          restartPolicy: Never
          priorityClassName: batch
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: sync
              image: ghcr.io/unorouter/new-api-sync:21b9dc6702b7528d4c36fdbc931ea7aa0e0870d4@sha256:7b1a59d97dbb9eca64ab5f0abb7b728f082fc9db661ac98f736a6577914aeaad
              args: ["run", "--only", "a7,ih,si"]
              env:
                - name: GUEST_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sync-env
                      key: GUEST_API_KEY
                - name: SYNC_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sync-env
                      key: SYNC_S3_ACCESS_KEY
                - name: SYNC_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sync-env
                      key: SYNC_S3_SECRET_KEY
                      optional: true
              resources:
                requests: { memory: 256Mi, cpu: 100m }
                limits: { memory: 2Gi }
              volumeMounts:
                - name: config
                  mountPath: /app/config.yml
                  subPath: config.yml
                - name: logs
                  mountPath: /app/logs
          volumes:
            - name: config
              secret: { secretName: sync-env }
            - name: logs
              persistentVolumeClaim: { claimName: new-api-sync-logs }
---
# Weekly full sync of the paid non-marketplace lanes (relay accounts, OpenRouter,
# Jev). Only a7, ih and si sync on the cluster, so the rest kept verdicts from
# whenever someone last ran them locally: on 2026-10-24, 70 providers carrying
# $1,859 a week had not been checked in 7+ days. Free lanes are left to the
# gateway's retests; every provider's prices are reread daily (job below).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: new-api-sync-weekly
  namespace: services
spec:
  schedule: "30 1 * * 3"
  timeZone: "Europe/Berlin"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 21600
      backoffLimit: 0
      template:
        metadata:
          labels: { app: new-api-sync-weekly }
        spec:
          restartPolicy: Never
          priorityClassName: batch
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: sync
              image: ghcr.io/unorouter/new-api-sync:21b9dc6702b7528d4c36fdbc931ea7aa0e0870d4@sha256:7b1a59d97dbb9eca64ab5f0abb7b728f082fc9db661ac98f736a6577914aeaad
              args: ["run", "--only", "no1,duck,fish,gg,pol,trp1,kdy1,nbi1,ts1,qnn1,bcf1,jev1,open4,open1,gem1,utim1,qr1,qr2,qr5,rdx1,lmh1,lnk1,lum1,rw1,akiyo"]
              env:
                - name: GUEST_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sync-env
                      key: GUEST_API_KEY
                - name: SYNC_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sync-env
                      key: SYNC_S3_ACCESS_KEY
                - name: SYNC_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sync-env
                      key: SYNC_S3_SECRET_KEY
                      optional: true
              resources:
                requests: { memory: 256Mi, cpu: 100m }
                limits: { memory: 3Gi }
              volumeMounts:
                - name: config
                  mountPath: /app/config.yml
                  subPath: config.yml
                - name: logs
                  mountPath: /app/logs
          volumes:
            - name: config
              secret: { secretName: sync-env-weekly }
            # Not the shared PVC: the full run may hold it, and verdicts merge through the store.
            - name: logs
              emptyDir: {}
---
# Daily price and metadata reread for every non-marketplace provider, no probes:
# a relay that reprices its groups is caught within a day, not at the weekly run.
# Same pod label as the weekly job, so the same network policies admit it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: new-api-sync-daily-metadata
  namespace: services
spec:
  schedule: "15 3 * * *"
  timeZone: "Europe/Berlin"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
