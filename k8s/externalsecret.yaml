# Minimal a7-only config.yml from OpenBao. Only a reference by key -- no secret
# value lives in this repo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sync-env
  namespace: services
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: sync-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: sync-env
  # The shared S3 gateway pair: config.yml refers to these as ${SYNC_S3_ACCESS_KEY}
  # and ${SYNC_S3_SECRET_KEY} in its verdictStore block.
  data:
    - secretKey: SYNC_S3_ACCESS_KEY
      remoteRef: { key: s3gw, property: ACCESS_KEY_ID }
    - secretKey: SYNC_S3_SECRET_KEY
      remoteRef: { key: s3gw, property: ACCESS_SECRET_KEY }
